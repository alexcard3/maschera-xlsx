name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Build
        run: python build.py
      - name: Build with the example theme
        run: python build.py --tema docs/tema-esempio.json --uscita "$RUNNER_TEMP/esempio.html"
      - name: Logic tests (invented data)
        run: |
          python tests/genera_prova.py "$RUNNER_TEMP/prova"
          node tests/collaudo.js "$RUNNER_TEMP/prova"
      - name: Package tests
        run: node tests/collaudo_pacchetto.js
