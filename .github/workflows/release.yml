name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Tests and build with read-only permissions: third-party packages (PyPI) run only here.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Tag must match VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Tests
        run: |
          pip install -r tests/requirements.txt
          python tests/genera_prova.py "$RUNNER_TEMP/prova"
          node tests/collaudo.js "$RUNNER_TEMP/prova"
          node tests/collaudo_pacchetto.js
          python build.py --tema docs/tema-esempio.json --uscita "$RUNNER_TEMP/esempio.html"
      - name: Build
        run: |
          python build.py
          cp LICENSE dist/LICENSE.txt
          cp vendor/LICENSE-SheetJS.txt dist/LICENSE-SheetJS.txt
          cd dist && sha256sum Maschera.html > SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          v="$(cat VERSION)"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ || /^\[[^]]*\]: / {f=0} f' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
          cat >> dist/notes.md <<'NOTE'

          ---

          **Download:** `Maschera.html` below, then double-click it. · **Scarica** `Maschera.html` qui sotto e aprilo con un doppio clic.

          **Verify · Verifica:** `gh attestation verify Maschera.html --repo ${{ github.repository }}`, or compare with `SHA256SUMS.txt` · oppure confronta con `SHA256SUMS.txt`.
          NOTE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishing: write permissions, nothing installed, nothing from the repository executed.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Maschera.html
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Maschera $GITHUB_REF_NAME" --notes-file dist/notes.md
          dist/Maschera.html dist/SHA256SUMS.txt dist/LICENSE.txt dist/LICENSE-SheetJS.txt
